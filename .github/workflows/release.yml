name: Auto-release

# Every push to master: build, unit tests, the coverage gate and the full e2e
# suite against a real (headless) Obsidian, then automatically bump the version
# (patch by default; put [minor] or [major] in the commit message to bump more;
# put [skip release] to only build and test), tag it and publish a GitHub
# release with main.js / manifest.json / styles.css - the assets BRAT and the
# Obsidian catalog consume.
#
# Master takes no direct pushes any more: work arrives through pull requests,
# which ci.yml gates. With a SQUASH merge the head commit message is the PULL
# REQUEST TITLE, so the marker this workflow reads ([minor], [major],
# [skip release]) has to be in the title of the pull request.
#
# Loop safety: the bot's own "release:" commit is filtered by the job `if`, and
# pushes made with GITHUB_TOKEN do not retrigger workflows anyway.

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The Obsidian the e2e suite drives on CI. Pinned on purpose: the suite reads
  # the app's own DOM, so a silent upgrade would show up as a plugin bug. This
  # is the build the suite was last verified against by hand.
  OBSIDIAN_VERSION: "1.12.4"

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'release:')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Unit tests
        run: npm test

      # Defence in depth: ci.yml runs this on every pull request, and a commit
      # can still reach master without one (the version bot pushes its own). The
      # thresholds live in .c8rc.json; the per-file table goes to the log so a
      # module losing coverage is visible here too.
      - name: Coverage
        run: npm run test:coverage

      # ---------------------------------------------------------------- e2e
      # The gate. The fill palette shipped invisible for three releases because
      # nothing drove the real app before a tag was cut; from here on a release
      # cannot happen unless the suite passes against a real Obsidian.
      #
      # The app is a pinned AppImage, unpacked (no FUSE on the runner) and
      # cached by version, and it runs under a virtual X server. Everything is
      # logged: when this breaks, it breaks on a machine nobody can look at.
      - name: Cache the Obsidian AppImage
        id: obsidian-cache
        uses: actions/cache@v4
        with:
          path: .obsidian-app
          key: obsidian-appimage-${{ env.OBSIDIAN_VERSION }}

      - name: Download Obsidian ${{ env.OBSIDIAN_VERSION }}
        if: steps.obsidian-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p .obsidian-app
          curl -fL --retry 3 --retry-delay 5 \
            -o .obsidian-app/Obsidian.AppImage \
            "https://github.com/obsidianmd/obsidian-releases/releases/download/v${OBSIDIAN_VERSION}/Obsidian-${OBSIDIAN_VERSION}.AppImage"
          chmod +x .obsidian-app/Obsidian.AppImage
          # --appimage-extract needs no FUSE, which ubuntu-latest does not have.
          cd .obsidian-app
          ./Obsidian.AppImage --appimage-extract
          rm -f Obsidian.AppImage
          ls -la squashfs-root/AppRun

      - name: Install the e2e driver
        run: |
          set -eux
          # playwright-core speaks CDP and downloads no browsers: the suite
          # attaches to Obsidian's own Chromium, it never launches one.
          # --no-package-lock so the lock file the release step commits is not
          # quietly given a dev-only dependency.
          npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.49.1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgbm1 libnss3 libgtk-3-0 libsecret-1-0
          # ALSA is `libasound2t64` on Ubuntu 24.04 and `libasound2` before it,
          # and Electron starts without either - so neither is worth failing on.
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2 \
            || echo "::warning::no ALSA package installed, continuing"

      - name: End-to-end tests (headless Obsidian)
        env:
          # The inner Electron binary, not AppRun: AppRun resolves paths via
          # $APPDIR, which only the AppImage runtime sets (without it, line 45
          # execs "/obsidian" and dies - seen in run 30253836396).
          SHEETS_OBSIDIAN_BIN: ${{ github.workspace }}/.obsidian-app/squashfs-root/obsidian
          SHEETS_PLAYWRIGHT: playwright-core
          # Never 9222: that is a developer's own Obsidian on the machine where
          # this suite is also run by hand.
          SHEETS_CDP_PORT: "9455"
        run: |
          set -eux
          ls -la "$SHEETS_OBSIDIAN_BIN"
          run_suite() {
            xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
              node tests/e2e.mjs --fresh
          }
          # One retry, and one only: a cold Electron on a cold runner sometimes
          # never reaches CDP. A suite that fails twice is a real failure.
          if ! run_suite; then
            echo "::warning::first e2e attempt failed, retrying once"
            cat .sandbox/obsidian.log || true
            pkill -f '\.sandbox/udata' || true
            sleep 10
            run_suite
          fi

      - name: Obsidian log and screenshots
        if: always()
        run: |
          echo "---- .sandbox/obsidian.log ----"
          cat .sandbox/obsidian.log || echo "(no log)"
          ls -la tests/shots || true

      - name: Upload the e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: tests/shots
          if-no-files-found: warn
          retention-days: 7

      - name: Decide bump kind
        id: bump
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if echo "$MSG" | grep -qF "[skip release]"; then
            echo "kind=skip" >> "$GITHUB_OUTPUT"
          elif echo "$MSG" | grep -qF "[major]"; then
            echo "kind=major" >> "$GITHUB_OUTPUT"
          elif echo "$MSG" | grep -qF "[minor]"; then
            echo "kind=minor" >> "$GITHUB_OUTPUT"
          else
            echo "kind=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version, commit, tag
        if: steps.bump.outputs.kind != 'skip'
        id: version
        run: |
          ver=$(node scripts/bump-version.mjs "${{ steps.bump.outputs.kind }}")
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json versions.json package.json package-lock.json
          git commit -m "release: $ver"
          git tag "$ver"
          git push origin master --tags

      - name: Rebuild with released manifest
        if: steps.bump.outputs.kind != 'skip'
        run: npm run build

      - name: Publish release
        if: steps.bump.outputs.kind != 'skip'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.ver }}" \
            --title "${{ steps.version.outputs.ver }}" \
            --generate-notes \
            main.js manifest.json styles.css
