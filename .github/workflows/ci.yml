name: CI

# The gate on a PULL REQUEST. Nothing reaches master except through here:
# master takes no direct pushes any more (the branch ruleset makes the `test`
# job below a required status check), so this file is what "green" means.
#
# It is deliberately the same work the release workflow does - build, unit
# tests, the coverage gate, then the full e2e against a real headless Obsidian -
# because a check that is weaker than the release is a check that lets a broken
# release through. release.yml keeps its own copy of the steps as defence in
# depth: a merge is not the only way a commit can land on master (the version
# bot pushes one itself), and duplicated YAML is cheaper here than a composite
# action nobody remembers to update.

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  # One run per pull request; a new push cancels the previous run of the SAME
  # pull request only.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned for the same reason as in release.yml: the suite reads the app's own
  # DOM, so a silent Obsidian upgrade would show up as a plugin bug.
  OBSIDIAN_VERSION: "1.12.4"

jobs:
  # NAME THIS CAREFULLY: `test` is the required status check on master.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Unit tests
        run: npm test

      # The regression gate. Thresholds live in .c8rc.json and are the level the
      # suite actually reached, rounded down; the per-file table is printed so a
      # module that is drifting is visible in the log rather than in a summary.
      - name: Coverage
        run: npm run test:coverage

      - name: Cache the Obsidian AppImage
        id: obsidian-cache
        uses: actions/cache@v4
        with:
          path: .obsidian-app
          key: obsidian-appimage-${{ env.OBSIDIAN_VERSION }}

      - name: Download Obsidian ${{ env.OBSIDIAN_VERSION }}
        if: steps.obsidian-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p .obsidian-app
          curl -fL --retry 3 --retry-delay 5 \
            -o .obsidian-app/Obsidian.AppImage \
            "https://github.com/obsidianmd/obsidian-releases/releases/download/v${OBSIDIAN_VERSION}/Obsidian-${OBSIDIAN_VERSION}.AppImage"
          chmod +x .obsidian-app/Obsidian.AppImage
          # --appimage-extract needs no FUSE, which ubuntu-latest does not have.
          cd .obsidian-app
          ./Obsidian.AppImage --appimage-extract
          rm -f Obsidian.AppImage
          ls -la squashfs-root/AppRun

      - name: Install the e2e driver
        run: |
          set -eux
          # playwright-core speaks CDP and downloads no browsers: the suite
          # attaches to Obsidian's own Chromium, it never launches one.
          npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.49.1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgbm1 libnss3 libgtk-3-0 libsecret-1-0
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2 \
            || echo "::warning::no ALSA package installed, continuing"

      - name: End-to-end tests (headless Obsidian)
        env:
          # The inner Electron binary, not AppRun: AppRun resolves paths via
          # $APPDIR, which only the AppImage runtime sets.
          SHEETS_OBSIDIAN_BIN: ${{ github.workspace }}/.obsidian-app/squashfs-root/obsidian
          SHEETS_PLAYWRIGHT: playwright-core
          # Never 9222: that is a developer's own Obsidian on the machine where
          # this suite is also run by hand.
          SHEETS_CDP_PORT: "9455"
        run: |
          set -eux
          ls -la "$SHEETS_OBSIDIAN_BIN"
          run_suite() {
            xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
              node tests/e2e.mjs --fresh
          }
          # One retry, and one only: a cold Electron on a cold runner sometimes
          # never reaches CDP. A suite that fails twice is a real failure.
          if ! run_suite; then
            echo "::warning::first e2e attempt failed, retrying once"
            cat .sandbox/obsidian.log || true
            pkill -f '\.sandbox/udata' || true
            sleep 10
            run_suite
          fi

      - name: Obsidian log
        if: failure()
        run: |
          echo "---- .sandbox/obsidian.log ----"
          cat .sandbox/obsidian.log || echo "(no log)"
          ls -la tests/shots || true

      - name: Upload the e2e screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots-pr-${{ github.event.pull_request.number }}
          path: tests/shots
          if-no-files-found: warn
          retention-days: 7
